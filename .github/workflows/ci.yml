name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ยกเลิก run เก่าของ branch เดิมเมื่อมี push ใหม่
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ชื่อ job = ชื่อ check ที่ branch protection บังคับ
  # ตั้งให้บอกว่า "ตรวจอะไร" ไม่ใช่ "ตรวจด้วยอะไร" การเปลี่ยนเครื่องมือจะได้ไม่ทำ ruleset พัง
  frontend:
    name: ตรวจฝั่งหน้าเว็บ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ตรวจไวยากรณ์ JavaScript
        run: node --check app.js

      - name: ตรวจว่า id ที่ app.js เรียกหามีอยู่จริงใน index.html
        run: node scripts/check-dom-ids.mjs

      - name: ตรวจ HTML ตามสเปกและ accessibility
        run: npx --yes html-validate@9 index.html

  schema:
    name: ตรวจสคีมาฐานข้อมูล
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fishing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_PWD: root
      MYSQL: mysql -h 127.0.0.1 -P 3306 -uroot --default-character-set=utf8mb4 fishing
    steps:
      - uses: actions/checkout@v4

      - name: ติดตั้ง mysql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client

      # จับบั๊กแบบที่เคยเจอ เช่น view อ้างคอลัมน์ที่ไม่มีอยู่จริง
      - name: รัน data-model.sql บนฐานข้อมูลเปล่า
        run: $MYSQL < data-model.sql

      - name: ตรวจว่า view และ seed ใช้งานได้
        run: |
          $MYSQL -e 'SELECT * FROM spot_planning_summary LIMIT 0;'
          count=$($MYSQL -N -B -e 'SELECT COUNT(*) FROM gear_rules;')
          if [ "$count" != "4" ]; then
            echo "gear_rules ต้องมี 4 แถวหลัง seed แต่ได้ $count"
            exit 1
          fi

      # กับดักที่อันตรายที่สุดของโปรเจค ถ้าลำดับแกนเปลี่ยน พิกัดทั้งระบบจะผิด
      - name: ตรวจลำดับแกน SRID 4326 ว่ายังเป็น Lat ก่อน Lon
        run: |
          $MYSQL -e "SELECT ST_GeomFromText('POINT(6.87 101.25)', 4326);" > /dev/null
          if $MYSQL -e "SELECT ST_GeomFromText('POINT(101.25 6.87)', 4326);" > /dev/null 2>&1; then
            echo 'เซิร์ฟเวอร์ยอมรับ POINT(lon lat) ซึ่งไม่ตรงกับที่ data-model.sql ระบุไว้'
            exit 1
          fi
          echo 'ลำดับแกนเป็น Lat ก่อน Lon ตามที่บันทึกไว้'

  api:
    name: ตรวจ API
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fishing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_PWD: root
      MYSQL: mysql -h 127.0.0.1 -P 3306 -uroot --default-character-set=utf8mb4 fishing
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: fishing
      DB_USER: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      # เผื่อกรณีเซิร์ฟเวอร์ถูกลดเวอร์ชันลง โค้ดเขียนให้รันได้ตั้งแต่ 8.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: ตรวจไวยากรณ์ PHP บน 8.1 (ขอบล่างที่รองรับ)
        run: find api tests -name '*.php' -print0 | xargs -0 -n1 php -l

      # เวอร์ชันที่ fishing.yru.ac.th ใช้จริง — integration test รันบนตัวนี้
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
      - name: ตรวจไวยากรณ์ PHP บน 8.4 (เวอร์ชันบนเซิร์ฟเวอร์จริง)
        run: find api tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: ติดตั้ง mysql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client

      - name: เตรียมฐานข้อมูลและข้อมูลทดสอบ
        run: |
          $MYSQL < data-model.sql
          $MYSQL < tests/fixtures.sql

      - name: รัน API แล้วทดสอบผ่าน HTTP จริง
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/gear.php?style=shore\&depth=1 > /dev/null && break
            sleep 1
          done
          API_BASE=http://127.0.0.1:8080 php tests/api-test.php

      - name: log ของเซิร์ฟเวอร์ ถ้าเทสต์ล้ม
        if: failure()
        run: cat /tmp/php-server.log
