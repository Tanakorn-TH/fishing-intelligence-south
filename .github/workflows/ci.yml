name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ยกเลิก run เก่าของ branch เดิมเมื่อมี push ใหม่
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ชื่อ job = ชื่อ check ที่ branch protection บังคับ
  # ตั้งให้บอกว่า "ตรวจอะไร" ไม่ใช่ "ตรวจด้วยอะไร" การเปลี่ยนเครื่องมือจะได้ไม่ทำ ruleset พัง
  frontend:
    name: ตรวจฝั่งหน้าเว็บ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ตรวจไวยากรณ์ JavaScript
        run: node --check app.js

      - name: ตรวจว่า id ที่ app.js เรียกหามีอยู่จริงใน index.html
        run: node scripts/check-dom-ids.mjs

      - name: ตรวจ HTML ตามสเปกและ accessibility
        run: npx --yes html-validate@9 index.html

  schema:
    name: ตรวจสคีมาฐานข้อมูล
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fishing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_PWD: root
      MYSQL: mysql -h 127.0.0.1 -P 3306 -uroot --default-character-set=utf8mb4 fishing
    steps:
      - uses: actions/checkout@v4

      - name: ติดตั้ง mysql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client

      # จับบั๊กแบบที่เคยเจอ เช่น view อ้างคอลัมน์ที่ไม่มีอยู่จริง
      - name: รัน data-model.sql บนฐานข้อมูลเปล่า
        run: $MYSQL < data-model.sql

      - name: ตรวจว่า view และ seed ใช้งานได้
        run: |
          $MYSQL -e 'SELECT * FROM spot_planning_summary LIMIT 0;'
          count=$($MYSQL -N -B -e 'SELECT COUNT(*) FROM gear_rules;')
          if [ "$count" != "4" ]; then
            echo "gear_rules ต้องมี 4 แถวหลัง seed แต่ได้ $count"
            exit 1
          fi

      # กับดักที่อันตรายที่สุดของโปรเจค ถ้าลำดับแกนเปลี่ยน พิกัดทั้งระบบจะผิด
      - name: ตรวจลำดับแกน SRID 4326 ว่ายังเป็น Lat ก่อน Lon
        run: |
          $MYSQL -e "SELECT ST_GeomFromText('POINT(6.87 101.25)', 4326);" > /dev/null
          if $MYSQL -e "SELECT ST_GeomFromText('POINT(101.25 6.87)', 4326);" > /dev/null 2>&1; then
            echo 'เซิร์ฟเวอร์ยอมรับ POINT(lon lat) ซึ่งไม่ตรงกับที่ data-model.sql ระบุไว้'
            exit 1
          fi
          echo 'ลำดับแกนเป็น Lat ก่อน Lon ตามที่บันทึกไว้'

  api:
    name: ตรวจ API
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fishing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_PWD: root
      MYSQL: mysql -h 127.0.0.1 -P 3306 -uroot --default-character-set=utf8mb4 fishing
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: fishing
      DB_USER: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      # เผื่อกรณีเซิร์ฟเวอร์ถูกลดเวอร์ชันลง โค้ดเขียนให้รันได้ตั้งแต่ 8.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: ตรวจไวยากรณ์ PHP บน 8.1 (ขอบล่างที่รองรับ)
        run: find api tests -name '*.php' -print0 | xargs -0 -n1 php -l

      # เวอร์ชันที่ fishing.yru.ac.th ใช้จริง — integration test รันบนตัวนี้
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
      - name: ตรวจไวยากรณ์ PHP บน 8.4 (เวอร์ชันบนเซิร์ฟเวอร์จริง)
        run: find api tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: ติดตั้ง mysql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client

      - name: เตรียมฐานข้อมูลและข้อมูลทดสอบ
        run: |
          $MYSQL < data-model.sql
          $MYSQL < tests/fixtures.sql

      - name: รัน API แล้วทดสอบผ่าน HTTP จริง
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/gear.php?style=shore\&depth=1 > /dev/null && break
            sleep 1
          done
          API_BASE=http://127.0.0.1:8080 php tests/api-test.php

      # solunar คำนวณในระบบทั้งหมด ไม่เรียกบริการภายนอกและไม่ใช้ฐานข้อมูล
      # จึงให้ผลเหมือนเดิมทุกครั้งและเอามากั้นการ merge ได้โดยไม่มีความเสี่ยงเรื่องความไม่เสถียร
      # ค่าที่ตรึงไว้มาจากตารางของ U.S. Naval Observatory ถ้าชุดนี้ตกแปลว่าสูตรดาราศาสตร์เพี้ยนจริง
      - name: ทดสอบ solunar (คำนวณในระบบ ไม่ต้องต่อเน็ต)
        run: API_BASE=http://127.0.0.1:8080 php tests/solunar-test.php

      - name: log ของเซิร์ฟเวอร์ ถ้าเทสต์ล้ม
        if: failure()
        run: cat /tmp/php-server.log

  # ---------------------------------------------------------------------------
  # ชุดที่ต้องออกไปหา Open-Meteo จริง แยกออกมาเป็น job ของตัวเองโดยตั้งใจ
  #
  # เหตุผลที่ไม่เอาไปรวมกับ job ด้านบน: ถ้าปลายทางล่ม การ merge ทุกอันจะถูกบล็อก
  # ทั้งที่โค้ดเราไม่ได้ผิดอะไร แยกไว้แบบนี้ผลจะยังขึ้นให้เห็นบน PR
  # (ล้มแล้วเป็นสีแดง) แต่ไม่ไปขวางงานคนอื่น ถ้าทีมอยากให้บล็อกด้วย
  # ให้เพิ่มชื่อ job นี้เข้าไปใน ruleset ของ branch เอาเอง
  # ---------------------------------------------------------------------------
  remote-api:
    name: ตรวจ API ที่ต้องต่ออินเทอร์เน็ต
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: รันเซิร์ฟเวอร์
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf 'http://127.0.0.1:8080/api/solunar.php?lat=6.87&lon=101.25' > /dev/null && break
            sleep 1
          done

      # endpoint เหล่านี้ไม่ใช้ฐานข้อมูล จึงไม่ต้องตั้ง MySQL ให้ job นี้
      - name: ทดสอบสภาพอากาศ
        run: API_BASE=http://127.0.0.1:8080 php tests/weather-test.php

      - name: ทดสอบระดับน้ำ
        run: API_BASE=http://127.0.0.1:8080 php tests/tides-test.php

      # score พึ่งทั้งอากาศและระดับน้ำ จึงรันท้ายสุด
      # ชุดนี้ยังเทียบน้ำหนักในโค้ดกับตารางใน docs/fishing-score.md ด้วย
      # ถ้าใครแก้สูตรโดยไม่แก้เอกสาร (หรือกลับกัน) จะตกตรงนี้
      - name: ทดสอบ Fishing Score
        run: API_BASE=http://127.0.0.1:8080 php tests/score-test.php

      # places ใช้ชุดข้อมูลในไฟล์เป็นหลัก จะผ่านได้แม้ geocoder ล่ม
      # แต่ยังออกเน็ตในบางเส้นทาง จึงอยู่ใน job นี้ ไม่ใช่ job ที่บล็อกการ merge
      # ตรวจสำคัญของชุดนี้คือพิกัดทุกจุดต้องอยู่ในกรอบภาคใต้จริง
      # ถ้าชุดข้อมูลถูกสร้างใหม่แล้วมีค่าหลุดออกนอกภาค จะจับได้ที่นี่
      - name: ทดสอบรายชื่อสถานที่
        run: API_BASE=http://127.0.0.1:8080 php tests/places-test.php

      - name: log ของเซิร์ฟเวอร์ ถ้าเทสต์ล้ม
        if: failure()
        run: cat /tmp/php-server.log
